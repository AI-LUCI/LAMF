name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install -r runtime/requirements.txt
      - run: python runtime/tests/run_final_tests.py
      - run: python runtime/tests/smoke_test.py
      - run: python runtime/tests/harness_test.py
      - run: python runtime/tests/installer_scope_test.py
